[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Ephoto360"
version = "0.1.1"
description = "Python client for Ephoto360.com image generation effects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TheHritu" }]
keywords = ["Ephoto360", "image generation", "logo effects", "web scraping", "requests"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "fake-useragent>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/TheHritu/Ephoto360"
Repository = "https://github.com/TheHritu/Ephoto360"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
Ephoto360 = ["logourls.json"]
